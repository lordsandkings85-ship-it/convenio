[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/groq/*"
  to = "/.netlify/functions/groq"
  status = 200

[[redirects]]
  from = "/api/resend/*"
  to = "/.netlify/functions/resend"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
