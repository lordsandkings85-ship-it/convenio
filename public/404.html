<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Convenio Mart</title>
    <script>
      // Single Page App redirect for static hosts
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      window.location.replace('/' + (path.startsWith('/') ? path.slice(1) : path) + search + hash);
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/">Convenio Mart</a>...</p>
  </body>
</html>
